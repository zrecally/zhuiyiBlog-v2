server {
    listen 80;
    server_name www.hizhuiyi.cn hizhuiyi.cn localhost;
# 静态资源请求 (模拟 CDN)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 禁止缓存 index.html
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    } 专门处理所有 SSE 连接，路由到 backend_socket 实例
    location ~ ^/api/v1/(notifications/stream|comments/stream) {
        proxy_pass http://backend_socket:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        # 普通接口随机打到 serverless 或 socket（这里暂时统一走 serverless，保证状态一致）
        proxy_pass http://backend_serverless:3001/api/;
        proxy_set_header Host $host;
        # 传递真实客户端IP，避免 Docker 内网 IP (如 172.x.x.x) 覆盖了真实的访客 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
