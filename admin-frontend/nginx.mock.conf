log_format zhuiyi_local '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_service backend:3001;
    access_log /var/log/nginx/access.log zhuiyi_local;

    # 静态资源请求 (模拟 CDN)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 禁止缓存 index.html
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 模拟 socket.zhuiyi.com 长连接网关
    location /socket/api/ {
        rewrite ^/socket/(.*) /$1 break;
        proxy_pass http://$backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # 传递真实客户端 IP，防爆盾依赖此字段
        # 修复 Cloudflare 代理节点 IP 被识别的问题：
        # 这里必须优先读取 HTTP_CF_CONNECTING_IP，如果不存在则回退读取 remote_addr
        set $real_client_ip $remote_addr;
        if ($http_cf_connecting_ip != "") {
            set $real_client_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;

        proxy_cache_bypass $http_upgrade;

        # 延长超时时间以支持 SSE 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

        # 模拟 api.zhuiyi.com (Vercel Serverless 网关)
    location /api/ {
        proxy_pass http://$backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 传递真实客户端 IP，防爆盾依赖此字段
        # 修复 Cloudflare 代理节点 IP 被识别的问题：
        # 这里必须优先读取 HTTP_CF_CONNECTING_IP，如果不存在则回退读取 remote_addr
        set $real_client_ip $remote_addr;
        if ($http_cf_connecting_ip != "") {
            set $real_client_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
    }
}
