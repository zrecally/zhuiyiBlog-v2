version: '3.8'

services:
  mtls-proxy:
    image: nginx:alpine
    container_name: zhuiyi_mtls_proxy
    ports:
      - "127.0.0.1:3852:3852"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
      - ../../logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-k", "--cert", "/etc/nginx/certs/client.crt", "--key", "/etc/nginx/certs/client.key", "https://127.0.0.1:3852/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
