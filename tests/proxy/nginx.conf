server {
    listen 3852 ssl;
    server_name localhost;

    # 服务端证书配置
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 客户端双向认证配置 (mTLS)
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on; # 强制要求合法客户端证书，否则在 TLS 握手阶段直接阻断

    # 强化 TLS 安全策略
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 隐藏 Nginx 版本号，防止版本探测
    server_tokens off;

    # 日志输出配置
    access_log /var/log/nginx/proxy_access.log;
    error_log /var/log/nginx/proxy_error.log;

    # 泛解析路由规则: /proxy/<target_host>/<path>
    location ~ ^/proxy/([^/]+)/(.*)$ {
        resolver 8.8.8.8 1.1.1.1 ipv6=off;
        set $target_host $1;
        set $target_path $2;

        # 代理到目标海外服务
        proxy_pass https://$target_host/$target_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $target_host;

        # 修复 GitHub API 返回过大 Header 导致的 502 错误
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # 安全防线：不透传客户端真实 IP，防止海外服务对业务服务器进行反向溯源
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }
}
