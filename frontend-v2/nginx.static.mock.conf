server {
    listen 80;
    server_name localhost;
    root /srv/zhuiyi-static/current;
    index index.html;
    server_tokens off;

    location /_start/suggest/ { return 404; }


    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/api(?:/|$) {
        return 404;
    }
    location ~* ^/(?:card|redeem)(?:/|$) { return 404; }

    location ^~ /_access/ { return 404; }

    location = /data {
        return 404;
    }

    location ~ ^/data/live/[A-Za-z0-9_-]+\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ "^/data/live/images/[a-f0-9]{64}\.(?:jpg|png|gif|webp)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location /data/ {
        return 404;
    }

    location ~* ^/test(?:[-_/][^/]*)?(?:/|$) {
        return 404;
    }

    location ~* ^/(?:fax-modem\.ogg|fax\.mp3|printer\.mp3|pigeon(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:admin|auth|login|oauth|danmaku)(?:/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* (?:^|/)(?:\.env(?:\..*)?|.*\.(?:pem|key|sql|bak|old|map))$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ ^/posts/[A-Za-z0-9_-]+/?$ { try_files /index.html =404; }
    location ~ ^/(?:posts|timeline|projects|friends|about|album|tools/album|banned)/?$ { try_files /index.html =404; }
    location / { return 404; }
}
