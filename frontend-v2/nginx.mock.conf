log_format zhuiyi_local '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=start_search:1m rate=5r/s;

server {
    listen 80;
    server_name localhost card.localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_service backend:3001;

    # Local start-page autocomplete: fixed upstreams only; never forward visitor credentials.
    location ~ ^/_start/suggest/(?<start_suggest_engine>bing|baidu|google|duckduckgo)$ {
        if ($request_method != GET) { return 405; }
        if ($arg_q = "") { return 400; }
        if ($arg_q ~ ".{2049}") { return 414; }
        set $suggest_upstream "";
        if ($start_suggest_engine = bing) {
            set $suggest_upstream "https://www.bing.com/osjson.aspx?query=$arg_q&market=zh-CN";
        }
        if ($start_suggest_engine = baidu) {
            set $suggest_upstream "https://suggestion.baidu.com/su?wd=$arg_q&action=opensearch&ie=utf-8";
        }
        if ($start_suggest_engine = google) {
            set $suggest_upstream "https://suggestqueries.google.com/complete/search?client=firefox&hl=zh-CN&ie=utf-8&oe=utf-8&q=$arg_q";
        }
        if ($start_suggest_engine = duckduckgo) {
            set $suggest_upstream "https://duckduckgo.com/ac/?q=$arg_q&type=list";
        }
        limit_req zone=start_search burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $suggest_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $proxy_host;
        proxy_set_header Accept application/json;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Content-Length "";
        proxy_set_header User-Agent "HI-ZhuiYi-Start/1.0";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Refresh;
        proxy_hide_header Alt-Svc;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Accept-CH;
        proxy_hide_header NEL;
        proxy_hide_header Report-To;
        proxy_hide_header Reporting-Endpoints;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
        # Upstream errors can contain the input query; suppress those request logs here.
        error_log /dev/null crit;
    }

    location /_start/suggest/ { return 404; }

    access_log /var/log/nginx/access.log zhuiyi_local;

    # 静态资源请求 (模拟 CDN)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /_access/ {
        rewrite ^/_access/(.*)$ /internal/article-access/$1 break;
        proxy_pass http://$backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Zhuiyi-Access-Gateway "local-only-article-gateway-secret-change-me-2026";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }

    # 禁止缓存 index.html
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 模拟 socket.zhuiyi.com 长连接网关
    location /socket/api/ {
        rewrite ^/socket/(.*) /$1 break;
        proxy_pass http://$backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # 传递真实客户端 IP，防爆盾依赖此字段
        # 修复 Cloudflare 代理节点 IP 被识别的问题：
        # 这里必须优先读取 HTTP_CF_CONNECTING_IP，如果不存在则回退读取 remote_addr
        set $real_client_ip $remote_addr;
        if ($http_cf_connecting_ip != "") {
            set $real_client_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;

        proxy_cache_bypass $http_upgrade;

        # 延长超时时间以支持 SSE 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

        # 模拟 api.zhuiyi.com (Vercel Serverless 网关)
    location /api/ {
        proxy_pass http://$backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 传递真实客户端 IP，防爆盾依赖此字段
        # 修复 Cloudflare 代理节点 IP 被识别的问题：
        # 这里必须优先读取 HTTP_CF_CONNECTING_IP，如果不存在则回退读取 remote_addr
        set $real_client_ip $remote_addr;
        if ($http_cf_connecting_ip != "") {
            set $real_client_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
    }
}
