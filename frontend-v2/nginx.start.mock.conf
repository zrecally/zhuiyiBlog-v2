limit_req_zone $binary_remote_addr zone=start_search:1m rate=5r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Local start-page autocomplete: fixed upstreams only; never forward visitor credentials.
    location ~ ^/_start/suggest/(?<start_suggest_engine>bing|baidu|google|duckduckgo)$ {
        if ($request_method != GET) { return 405; }
        if ($arg_q = "") { return 400; }
        if ($arg_q ~ ".{2049}") { return 414; }
        set $suggest_upstream "";
        if ($start_suggest_engine = bing) {
            set $suggest_upstream "https://www.bing.com/osjson.aspx?query=$arg_q&market=zh-CN";
        }
        if ($start_suggest_engine = baidu) {
            set $suggest_upstream "https://suggestion.baidu.com/su?wd=$arg_q&action=opensearch&ie=utf-8";
        }
        if ($start_suggest_engine = google) {
            set $suggest_upstream "https://suggestqueries.google.com/complete/search?client=firefox&hl=zh-CN&ie=utf-8&oe=utf-8&q=$arg_q";
        }
        if ($start_suggest_engine = duckduckgo) {
            set $suggest_upstream "https://duckduckgo.com/ac/?q=$arg_q&type=list";
        }
        limit_req zone=start_search burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $suggest_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $proxy_host;
        proxy_set_header Accept application/json;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Content-Length "";
        proxy_set_header User-Agent "HI-ZhuiYi-Start/1.0";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Refresh;
        proxy_hide_header Alt-Svc;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Accept-CH;
        proxy_hide_header NEL;
        proxy_hide_header Report-To;
        proxy_hide_header Reporting-Endpoints;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
        # Upstream errors can contain the input query; suppress those request logs here.
        error_log /dev/null crit;
    }

    location /_start/suggest/ { return 404; }

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /site-compliance.json {
        alias /srv/zhuiyi-static/current/data/live/site-compliance.json;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /police-beian.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /LXGW-WENKAI-LICENSES.txt { try_files $uri =404; }
    location = /images/start-page-landscape-background-v1.webp { try_files $uri =404; }
    location ~ ^/assets/[A-Za-z0-9_.-]+\.(?:js|css|woff2?)$ { try_files $uri =404; }

    # Keep the local static mock honest: no API, login, upload or SPA fallback.
    location / { return 404; }
}
